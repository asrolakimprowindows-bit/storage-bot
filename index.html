<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090a15">
  <meta name="description" content="Aplikasi uji build dengan antarmuka liquid glass iOS.">
  <title>Test Build Berhasil</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <span class="orb orb-one"></span>
    <span class="orb orb-two"></span>
    <span class="orb orb-three"></span>
  </div>

  <main class="stage">
    <section class="hero" aria-labelledby="build-title">
      <div class="tilt" data-tilt>
        <article class="glass-card">
          <span class="glass-highlight" aria-hidden="true"></span>

          <div class="badge">
            <span class="badge-dot" aria-hidden="true"></span>
            <span>Live preview</span>
          </div>

          <h1 id="build-title">Test Build Berhasil</h1>
          <p class="subtitle">Aplikasi kecil dengan nuansa liquid glass iOS.</p>

          <div class="divider" aria-hidden="true"></div>

          <div class="meta">
            <span>Fluid motion</span>
            <span>Responsive</span>
          </div>
        </article>
      </div>
    </section>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
